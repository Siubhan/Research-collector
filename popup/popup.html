<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Research Collector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <img class="logo-img" src="../icons/icon-48.png" />
      <h1>Research Collector</h1>
    </header>

    <section class="session-info">
      <div class="session-row">
        <span class="session-dot" id="session-dot"></span>
        <span id="session-name" class="session-name">—</span>
        <button id="btn-edit-session" class="icon-btn" title="Редактировать">✎</button>
      </div>
    </section>

    <section class="add-entry">
      <textarea id="input-text" placeholder="Вставьте цитату…" rows="4"></textarea>
      <input id="input-title" type="text" placeholder="Заголовок (необязательно)" />
      <input id="input-comment" type="text" placeholder="Комментарий (необязательно)" />
      <button id="btn-save" class="btn-primary">Сохранить цитату</button>
    </section>

    <section class="actions">
      <button id="btn-sidebar" class="btn-secondary">Открыть боковую панель</button>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
