<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Collector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <span class="logo">📚</span>
      <h1 class="title">Research Collector</h1>
      <button id="btn-sidebar" class="icon-btn" title="Открыть панель">⊞</button>
    </header>

    <!-- Текущая сессия -->
    <section class="session-bar">
      <div class="session-info">
        <span class="session-label">Сессия:</span>
        <span id="session-name" class="session-name">—</span>
      </div>
      <button id="btn-switch" class="text-btn">Сменить</button>
    </section>

    <!-- Счётчик -->
    <div class="stats">
      <span id="count">0</span> цитат сохранено
    </div>

    <!-- Быстрое добавление -->
    <section class="quick-add">
      <textarea id="quick-text" placeholder="Вставьте текст цитаты…" rows="3"></textarea>
      <button id="btn-save" class="btn-primary">Сохранить цитату с этой страницы</button>
    </section>

    <!-- Действия -->
    <section class="actions">
      <button id="btn-export-json" class="btn-secondary">⬇ JSON</button>
      <button id="btn-export-txt" class="btn-secondary">⬇ Источники</button>
      <button id="btn-new-session" class="btn-secondary">＋ Новая работа</button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
